<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- X（旧 Twitter）の公式アカウント用の画像の元：?v=header（ヘッダー 1500×500。トップの一番上の絵の「空」だけ）／?v=icon（アイコン 400×400。X が丸く切りぬく。縁のハンコ）。
     tools/make-x-images.sh が、これを画像にして design/x/ に書く。ハンコは OGP（tools/ogp.html の G）・サイネージの切りかわりと同じ -->
<link href="https://fonts.googleapis.com/css2?family=WDXL+Lubrifont+JP+N&display=block&text=%E7%AC%AC63%E5%9B%9E%E5%87%BD%E9%A4%A8%E9%AB%98%E5%B0%82%E7%A5%AD%E3%81%88%E3%81%AB%E3%81%9710.24SAT12%3A00%EF%BD%9E16%3A0025SUN%E3%80%9C%E7%B8%81" rel="stylesheet">
<style>
  html, body { margin: 0; overflow: hidden; }
  body { position: relative; font-family: "WDXL Lubrifont JP N", sans-serif; }
  body.header { width: 1500px; height: 500px; }
  body.icon { width: 400px; height: 400px; }
  .bg { position: absolute; inset: 0; }
  /* ヘッダー：トップの一番上の絵の空（sky-sunset.webp の y=300 から。左上の青緑から、雲、下の桃色へ）だけ。ロゴ・文字・模様は入れない。右はしのうすい縁を避けて、少し大きめに */
  .header .bg { background: url("../site/assets/img/sky-sunset.webp") -15px -378px / 1530px auto no-repeat; }
  /* アイコン：トップの背景の絵（top-bg.webp・804×2106）の y=820 から（ノイズのある、不規則なグラデーション）に、縁のハンコ */
  .icon .bg { background: url("../site/assets/img/top-bg.webp") 0 -408px / 400px auto no-repeat; }
  .en { position: absolute; color: #FEEBC4; transform: rotate(-14deg); font-weight: 400; line-height: 1; }
  /* 丸く切りぬかれても収まる大きさ。影が右下にのびるぶん、字を左上に寄せて、見た目の真ん中に */
  .icon .en { left: 69px; top: 32px; width: 260px; height: 260px; font-size: 270px; text-shadow: 6px 6px 0 #d9669b, 12px 12px 0 #2f8fe0, 18px 18px 0 #ffd24a, 24px 24px 0 #ff6b5e; }
</style>
</head>
<body>
<script>
  const v = new URLSearchParams(location.search).get("v") || "header";
  document.body.className = v;
  document.body.insertAdjacentHTML("afterbegin", v === "icon" ? `<div class="bg"></div><div class="en">縁</div>` : `<div class="bg"></div>`);
</script>
</body>
</html>
