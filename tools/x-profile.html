<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- X（旧 Twitter）の公式アカウント用の画像の元：?v=header（ヘッダー 1500×500。トップの一番上の絵の「空」だけ）／?v=icon（アイコン 400×400。X が丸く切りぬく。縁のハンコ）。
     tools/make-x-images.sh が、これを画像にして design/x/ に書く。ハンコは OGP（tools/ogp.html の G）・サイネージの切りかわりと同じ -->
<link href="https://fonts.googleapis.com/css2?family=WDXL+Lubrifont+JP+N&display=block&text=%E7%AC%AC63%E5%9B%9E%E5%87%BD%E9%A4%A8%E9%AB%98%E5%B0%82%E7%A5%AD%E3%81%88%E3%81%AB%E3%81%9710.24SAT12%3A00%EF%BD%9E16%3A0025SUN%E3%80%9C%E7%B8%81" rel="stylesheet">
<style>
  html, body { margin: 0; overflow: hidden; }
  body { position: relative; font-family: "WDXL Lubrifont JP N", sans-serif; }
  body.header { width: 1500px; height: 500px; }
  body.icon { width: 400px; height: 400px; }
  .bg { position: absolute; inset: 0; }
  /* ヘッダー：トップの一番上の絵の空（sky-sunset.webp の y=300 から。左上の青緑から、雲、下の桃色へ）だけ。ロゴ・文字・模様は入れない。右はしのうすい縁を避けて、少し大きめに */
  .header .bg { background: url("../site/assets/img/sky-sunset.webp") -15px -378px / 1530px auto no-repeat; }
  /* アイコン：トップの背景の絵（top-bg.webp・804×2106）の y=820 から（ノイズのある、不規則なグラデーション）に、縁のハンコ */
  .icon .bg { background: url("../site/assets/img/top-bg.webp") 0 -408px / 400px auto no-repeat; }
  /* ヘッダーの案（headerA・headerB・headerC）：右側だけを使う（左下はアイコンが重なる） */
  .hA .bg, .hB .bg, .hC .bg { background: url("../site/assets/img/sky-sunset.webp") -15px -378px / 1530px auto no-repeat; }
  .hA .logo { position: absolute; right: 120px; top: 40px; height: 420px; width: auto; }
  .hB .txt { position: absolute; right: 90px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; color: #634A2E; text-shadow: 3px 3px 0 rgba(254, 235, 196, .8); }
  .hB .t { margin: 0; font-weight: 400; font-size: 72px; line-height: 1.15; letter-spacing: .02em; white-space: nowrap; }
  .hB .d { margin: 18px 0 0; font-size: 40px; line-height: 1.3; letter-spacing: .04em; white-space: nowrap; }
  .hC svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hC line { stroke: #4a3b36; stroke-linecap: round; }
  .en { position: absolute; color: #FEEBC4; transform: rotate(-14deg); font-weight: 400; line-height: 1; }
  /* 丸く切りぬかれても収まる大きさ。影が右下にのびるぶん、字を左上に寄せて、見た目の真ん中に */
  .icon .en { left: 69px; top: 32px; width: 260px; height: 260px; font-size: 270px; text-shadow: 6px 6px 0 #d9669b, 12px 12px 0 #2f8fe0, 18px 18px 0 #ffd24a, 24px 24px 0 #ff6b5e; }
</style>
</head>
<body>
<script>
  const v = new URLSearchParams(location.search).get("v") || "header";
  document.body.className = v.startsWith("header") && v.length > 6 ? `header h${v.slice(6)}` : v;
  const html = {
    header: `<div class="bg"></div>`,
    icon: `<div class="bg"></div><div class="en">縁</div>`,
    headerA: `<div class="bg"></div><img class="logo" src="../site/assets/img/logo.webp" alt="">`,
    headerB: `<div class="bg"></div><div class="txt"><h1 class="t">第63回 函館高専祭「縁」</h1><p class="d">10.24 SAT・10.25 SUN</p></div>`,
    headerC: `<div class="bg"></div><svg viewBox="0 0 1500 500" aria-hidden="true"><line x1="-20" y1="300" x2="1520" y2="40" stroke-width="3"/><line x1="-20" y1="342" x2="1520" y2="52" stroke-width="2.4"/><line x1="560" y1="215" x2="1520" y2="-6" stroke-width="2"/></svg>`,
  }[v];
  document.body.insertAdjacentHTML("afterbegin", html);
</script>
</body>
</html>
