<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- 企画のロゴ（仮）の元。?v=名前 で1つずつ、透明な背景で描く（tools/make-event-logos.sh が site/assets/img/logo-◯◯.webp にする）。
     サイトの「縁」のハンコと同じ作り：太い字（WDXL）に、色のついた影を重ねる。企画ごとに、字の色・影の色・傾きだけを変える -->
<link href="https://fonts.googleapis.com/css2?family=WDXL+Lubrifont+JP+N&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  body { width: 900px; height: 420px; display: grid; place-items: center; font-family: "WDXL Lubrifont JP N", sans-serif; }
  .lg { font-weight: 400; line-height: 1.08; letter-spacing: .03em; text-align: center; padding: 20px 50px 50px 20px; color: var(--f); rotate: var(--r); text-shadow: 9px 9px 0 var(--a), 18px 18px 0 var(--b), 27px 27px 0 var(--c); }
</style></head>
<body><div class="lg" id="lg"></div>
<script>
  const L = {
    hanabi: { t: "花火",           size: 250, f: "#FEEBC4", r: "-6deg", c: ["#d9669b", "#a061c9", "#2a1d5e"] },
    stage:  { t: "ステージ",       size: 170, f: "#FEEBC4", r: "-4deg", c: ["#2f8fe0", "#d9669b", "#ffd24a"] },
    tissue: { t: "ティッシュ<br>＆うちわ", size: 120, f: "#FEEBC4", r: "-3deg", c: ["#ff6b5e", "#ffd24a", "#2f8fe0"] },
    decor:  { t: "校内装飾",       size: 180, f: "#FEEBC4", r: "3deg",  c: ["#3E9A86", "#2f8fe0", "#ffd24a"] },
  };
  const v = new URLSearchParams(location.search).get("v") || "hanabi", d = L[v];
  const el = document.getElementById("lg");
  el.innerHTML = d.t;
  el.style.cssText = "font-size:" + d.size + "px;--f:" + d.f + ";--r:" + d.r + ";--a:" + d.c[0] + ";--b:" + d.c[1] + ";--c:" + d.c[2];
</script></body></html>
