  <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@500;700&amp;display=swap&amp;text=Enistagram" rel="stylesheet">

<body class="mido-page ai-page" data-page="ai">
  <main class="mido mido-full ai-full" id="ai" aria-label="AIくん">
    <button type="button" class="mido-close ai-new" id="ai-new" aria-label="新しい会話" title="新しい会話" hidden><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></button>
    <a class="mido-close" href="./" aria-label="とじる"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></span></a>

    <div class="ai-scroll" id="ai-scroll">
      <div class="ai-empty" id="ai-empty">
        <i class="ai-av is-big" id="ai-empty-av" aria-hidden="true"></i>
        <h1>おう、何が知りてえ？</h1>
        <p>高専祭のことなら、任せとけ。</p>
        <div class="ai-chips" id="ai-chips"></div>
      </div>
      <div class="ai-log" id="ai-log" role="log" aria-live="polite"></div>
    </div>
    <button type="button" class="ai-down" id="ai-down" aria-label="いちばん下へ" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>

    <footer class="ai-foot">
      <form class="ai-form" id="ai-form">
        <svg class="ai-glass" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/></svg>
        <textarea id="ai-q" rows="1" maxlength="200" placeholder="聞いてみる" aria-label="質問" enterkeyhint="send"></textarea>
        <button type="submit" class="ai-send" id="ai-send" aria-label="送る" disabled></button>
      </form>
      <p class="ai-note">AIの答えは、まちがうことがあります。個人情報は書かないでください。<a href="terms.html">くわしく</a></p>
    </footer>
  </main>

  <script type="module" src="assets/sheet-page.js"></script>

  <script type="module" src="assets/side.js"></script>
