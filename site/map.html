<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>校内マップ｜第63回 函館高専祭「縁」</title>
  <meta name="description" content="第63回 函館高専祭の校内マップ。会場・お店・トイレの場所、いまいる場所からの道案内、会場の混雑状況。">
  <meta property="og:title" content="校内マップ｜第63回 函館高専祭「縁」">
  <meta property="og:image" content="https://hakodate-ct.jp/gac_event/assets/img/ogp.jpg">
  <meta name="theme-color" content="#ffffff" data-light="#ffffff" data-dark="#202124">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest"><!-- サイトと同じアプリ（下のタブで切りかえ） -->
  <link rel="apple-touch-icon" href="assets/img/icon-180.png">
  <meta name="apple-mobile-web-app-title" content="高専祭">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Firebase（お知らせ・混雑・投稿）は、ページの部品と同時に読みはじめる（版は assets/live.js の FIREBASE_VERSION と同じにする） -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" crossorigin>
  <!-- ページの部品を最初にまとめて読む（import を1段ずつたどって待たないように） -->
  <link rel="modulepreload" href="assets/map-page.js">
  <link rel="modulepreload" href="assets/config.js">
  <link rel="modulepreload" href="assets/site-text.js">
  <link rel="modulepreload" href="assets/live.js">
  <link rel="modulepreload" href="assets/rally.js">
  <link rel="modulepreload" href="assets/rally-data.js">
  <link rel="modulepreload" href="assets/map.js">
  <link rel="modulepreload" href="assets/campus.js">
  <link rel="modulepreload" href="assets/route.js">
  <link rel="modulepreload" href="assets/posts.js">
  <link rel="modulepreload" href="assets/offline.js">
  <link rel="modulepreload" href="assets/qr-scan.js">
  <link rel="modulepreload" href="assets/side.js">
  <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@500;700&family=LINE+Seed+JP:wght@400;700;800&family=Noto+Sans+JP:wght@400;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <!-- 地図・Enistagram はトップと同じ字：短い見出し・ボタンは WDXL Lubrifont、文は Zen Kaku Gothic New。
       場所の名前や投稿はどんな字も出るので、字をしぼらずに読みこむ（Google Fonts が使う字の分だけ小分けにして届ける） -->
  <link href="https://fonts.googleapis.com/css2?family=WDXL+Lubrifont+JP+N&amp;family=Zen+Kaku+Gothic+New:wght@700;900&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="preload" href="assets/map/rooms.json" as="fetch" crossorigin>
  <!-- 次に開きそうなページ（下のタブ・同じサイトのリンク）を、押しそうになったら裏で先に用意する（Chrome）。本部用は除く -->
  <script type="speculationrules">
  { "prerender": [{ "where": { "and": [{ "href_matches": "/*" }, { "not": { "href_matches": "/*staff/*" } }, { "not": { "href_matches": "*emulator*" } }] }, "eagerness": "moderate" }] }
  </script>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/map.css">
  <script src="assets/theme.js"></script><!-- ライト／ダークと差し色（描く前に決める） -->
</head>
<body class="mapapp">
  <!-- アプリの画面（PC では真ん中のスマホの幅。まわりは side.js の左右の案内） -->
  <div class="app-frame">
  <main class="m-canvas" id="m-canvas">
    <svg id="map-svg" role="application" aria-label="校内マップ。ドラッグで動かし、ピンチかホイールで拡大縮小。部屋を押すと中身と道案内が出ます。"></svg>
    <p class="m-loading" id="m-loading">地図を読み込んでいます…</p>
  </main>

  <header class="m-top">
    <div class="m-bar">
      <!-- 左はしは押しまちがえないように、ボタンではなく虫眼鏡（押すと入力欄）。トップへはいちばん下のタブの「サイト」から -->
      <label class="m-search">
        <svg class="m-glass" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20.5 20.5"/></svg>
        <span class="visually-hidden">場所をさがす</span>
        <input id="m-q" type="search" enterkeyhint="search" autocomplete="off" placeholder="場所・お店をさがす">
      </label>
      <button type="button" class="m-clear" id="m-clear" aria-label="検索をやめる" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="m-chips" id="m-chips" role="toolbar" aria-label="よく探すもの"></div>
    <!-- 会場の混雑（本部が更新したときだけ出る）。押すとその会場へ -->
    <p class="m-notice" id="m-notice" hidden><span></span><button type="button" data-close aria-label="お知らせを閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></p>
  </header>

  <div class="m-results" id="m-results" hidden></div>

  <div class="m-side">
    <div class="m-floors" id="m-floors" role="radiogroup" aria-label="階"></div>
    <button type="button" class="m-fab m-qr" id="m-locate" aria-label="「いまここ」QRを読む" title="「いまここ」QRを読む"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M8 8h3v3H8zM13 8h3v3h-3zM8 13h3v3H8zM13 13h1.5M16 13v3h-3"/></svg></button>
    <button type="button" class="m-fab m-heading" id="m-heading" aria-label="地図を自分の向いている方向に合わせる" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l6.5 17L12 16l-6.5 4z"/></svg></button>
    <button type="button" class="m-compass" id="m-compass" aria-label="北を上にする（もう一度押すと校内図の向き）"><i></i><b>N</b></button>
    <button type="button" class="m-fab m-tilt" id="m-tilt" aria-label="地図を傾けて見る" aria-pressed="false">3D</button>
    <button type="button" class="m-fab" id="m-fit" aria-label="校舎と敷地全体を切りかえ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <!-- 地図の見かた（色と印の意味）。さがす欄から、右のボタンの列へ -->
    <button type="button" class="m-fab m-help" id="m-help" aria-label="地図の見かた（色と印の意味）">?</button>
  </div>

  <section class="m-sheet" id="m-sheet" aria-label="場所の情報と道案内" hidden>
    <button type="button" class="m-grip" id="m-grip" aria-label="広げる"></button>
    <button type="button" class="m-sheet-x" id="m-sheet-x" aria-label="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="m-sheet-body" id="m-sheet-body"></div>
  </section>

  <!-- Enistagram（エニスタグラム）：来場者の SNS。タイムライン・写真 -->
  <section class="m-feed" id="m-feed" aria-label="Enistagram" hidden>
    <header class="f-head">
      <h2 class="f-logo"><img src="assets/img/enistagram.webp" width="640" height="114" alt="Enistagram"></h2>
      <div class="f-seg" role="tablist" aria-label="見かた"><button type="button" role="tab" data-fv="timeline" aria-selected="true">タイムライン</button><button type="button" role="tab" data-fv="photos" aria-selected="false">写真</button></div>
    </header>
    <div class="f-compose" id="m-feed-compose" hidden></div>
    <div class="f-body" id="m-feed-list"></div>
    <button type="button" class="f-fab" id="m-feed-post"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.6 5.2A9 9 0 1 0 16.6 18.8L9.5 12z"/><circle cx="9" cy="7.2" r="1.1" fill="currentColor" stroke="none"/><circle cx="13.3" cy="12" r="1.35" fill="currentColor" stroke="none"/><circle cx="17.3" cy="12" r="1.35" fill="currentColor" stroke="none"/><circle cx="21.3" cy="12" r="1.35" fill="currentColor" stroke="none"/></svg>ポスト</button>
  </section>
  <nav class="m-tabs" id="m-tabs" aria-label="切りかえ">
    <a href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11L12 4l8.5 7M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg>サイト</a>
    <button type="button" data-tab="map" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5zM9 4v13.5M15 6.5V20"/></svg>地図</button>
    <button type="button" data-tab="feed" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.6 5.2A9 9 0 1 0 16.6 18.8L9.5 12z"/><circle cx="9" cy="7.2" r="1.1" fill="currentColor" stroke="none"/><circle cx="13.3" cy="12" r="1.35" fill="currentColor" stroke="none"/><circle cx="17.3" cy="12" r="1.35" fill="currentColor" stroke="none"/><circle cx="21.3" cy="12" r="1.35" fill="currentColor" stroke="none"/></svg><span class="e-word">Enistagram</span></button>
  </nav>

  <p class="m-toast" id="m-toast" role="status" hidden></p>
  <dialog class="m-scan" id="m-scan" aria-label="「いまここ」QRを読む">
    <p class="scan-title">「いまここ」QRを読む</p>
    <div class="scan-view"><video playsinline muted></video><i class="scan-frame" aria-hidden="true"></i></div>
    <p class="scan-msg" role="status"></p>
    <button type="button" class="sh-btn" id="m-scan-x">やめる</button>
  </dialog>
  <dialog class="m-legend" id="m-legend" aria-label="地図の見かた">
    <div class="lg-head"><h2>地図の見かた</h2><button type="button" class="m-sheet-x" data-close aria-label="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="m-legend-body"></div>
  </dialog>

  </div>

  <script type="module" src="assets/map-page.js"></script>
  <script type="module" src="assets/side.js"></script>
</body>
</html>
