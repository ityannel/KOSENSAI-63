<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>本部用：混雑状況と5人の実況</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #2E2F32; --card: #494A4E; --ink: #F3EEE6; --sub: #B9B2A8; --radius: 14px; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; }
    main { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 1.2rem; margin: 8px 0 16px; }
    .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
    .card h2 { margin: 0 0 4px; font-size: 1.1rem; }
    .now { margin: 0 0 12px; color: var(--sub); font-size: 0.9rem; }
    .now b { color: var(--ink); }
    .levels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .levels button {
      padding: 16px 8px; border: 3px solid transparent; border-radius: 10px; cursor: pointer;
      font: inherit; font-weight: 900; font-size: 1rem; color: #2A2624; background: var(--c);
    }
    .levels button[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 3px #2A2624 inset; }
    .levels button:disabled { opacity: 0.6; }
    form { display: grid; gap: 10px; }
    input { padding: 12px; border-radius: 10px; border: 0; font: inherit; }
    .primary { padding: 12px; border: 0; border-radius: 999px; background: #F2A96A; color: #2A2624; font: inherit; font-weight: 900; cursor: pointer; }
    .msg { min-height: 1.5em; color: #F2A96A; font-weight: 700; }
    .foot { display: flex; justify-content: space-between; align-items: center; color: var(--sub); font-size: 0.85rem; }
    .foot button { background: none; border: 1px solid var(--sub); color: var(--sub); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
    .chatter label { display: block; margin: 10px 0 4px; font-size: 0.85rem; color: var(--sub); }
    .chatter input { width: 100%; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    .row button { flex: 1; }
    .ghost { padding: 12px; border: 1px solid var(--sub); border-radius: 999px; background: none; color: var(--ink); font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>本部用：混雑状況と5人の実況</h1>

    <section class="card" id="login" hidden>
      <form id="login-form">
        <input id="email" type="email" autocomplete="username" placeholder="本部用メールアドレス" required>
        <input id="password" type="password" autocomplete="current-password" placeholder="パスワード" required>
        <button class="primary" type="submit">ログイン</button>
      </form>
      <p class="msg" id="login-msg" role="status"></p>
    </section>

    <div id="panel" hidden>
      <div id="venues"></div>
      <p class="msg" id="msg" role="status"></p>

      <section class="card chatter">
        <h2>5人の実況（空にすると、いつものセリフに戻る）</h2>
        <form id="chatter-form">
          <label for="c-p1">白いシャツの人（企画案内）</label><input id="c-p1" maxlength="40">
          <label for="c-p2">パーカーの人（模擬店）</label><input id="c-p2" maxlength="40">
          <label for="c-p3">走っている人（スタンプラリー）</label><input id="c-p3" maxlength="40">
          <label for="c-p4">手を伸ばしている人（イベント）</label><input id="c-p4" maxlength="40" placeholder="例：いま体育館、めっちゃ盛り上がってる！">
          <label for="c-p5">黒い服の人（来場案内）</label><input id="c-p5" maxlength="40">
          <div class="row">
            <button class="primary" type="submit">公開する</button>
            <button class="ghost" type="button" id="chatter-clear">全部消す</button>
          </div>
        </form>
        <p class="msg" id="chatter-msg" role="status"></p>
      </section>
      <div class="foot"><span id="who"></span><button type="button" id="logout">ログアウト</button></div>
    </div>
  </main>

  <script type="module">
    import { CROWD, VENUES } from "../assets/config.js";
    import { FIREBASE_VERSION, firebaseConfig } from "../assets/live.js";

    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;
    const [{ initializeApp }, auth, fs] = await Promise.all([
      import(`${base}/firebase-app.js`),
      import(`${base}/firebase-auth.js`),
      import(`${base}/firebase-firestore.js`),
    ]);
    const app = initializeApp(firebaseConfig);
    const a = auth.getAuth(app);
    const db = fs.getFirestore(app);
    const $ = (s) => document.querySelector(s);
    const venueName = (id) => { const v = VENUES.find((x) => x.id === id); return v ? (v.alias ? `${v.alias}（${v.name}）` : v.name) : id; };

    let current = {};
    let unsubscribe = null;

    function render() {
      $("#venues").innerHTML = CROWD.venues.map((id) => {
        const c = current[id];
        const t = c?.updated_at ? new Date(c.updated_at).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" }) : null;
        return `
          <section class="card">
            <h2>${venueName(id)}</h2>
            <p class="now">いま：<b>${CROWD.levels[c?.level]?.label ?? "未設定"}</b>${t ? `（${t} 更新）` : ""}</p>
            <div class="levels">
              ${CROWD.levels.map((lv, i) => `
                <button type="button" data-venue="${id}" data-level="${i}" style="--c:${lv.color}" aria-pressed="${c?.level === i}">${lv.label}</button>`).join("")}
            </div>
          </section>`;
      }).join("");
    }

    $("#venues").addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-venue]");
      if (!btn) return;
      const buttons = document.querySelectorAll(".levels button");
      buttons.forEach((b) => (b.disabled = true));
      try {
        await fs.setDoc(fs.doc(db, "crowd", btn.dataset.venue), {
          level: Number(btn.dataset.level),
          updated_at: fs.serverTimestamp(),
        });
        $("#msg").textContent = `${venueName(btn.dataset.venue)} を「${CROWD.levels[btn.dataset.level].label}」にしました`;
      } catch (err) {
        $("#msg").textContent = `更新できませんでした（${err.code}）`;
      } finally {
        buttons.forEach((b) => (b.disabled = false));
      }
    });

    // ---------- 5人の実況 ----------
    const PEOPLE = ["p1", "p2", "p3", "p4", "p5"];
    async function saveChatter(values) {
      try {
        await fs.setDoc(fs.doc(db, "chatter", "current"), { ...values, updated_at: fs.serverTimestamp() });
        $("#chatter-msg").textContent = "公開しました（サイトを開いている人に、すぐしゃべります）";
      } catch (err) {
        $("#chatter-msg").textContent = `公開できませんでした（${err.code}）`;
      }
    }
    $("#chatter-form").addEventListener("submit", (e) => {
      e.preventDefault();
      saveChatter(Object.fromEntries(PEOPLE.map((p) => [p, $(`#c-${p}`).value.trim()])));
    });
    $("#chatter-clear").addEventListener("click", () => {
      PEOPLE.forEach((p) => ($(`#c-${p}`).value = ""));
      saveChatter(Object.fromEntries(PEOPLE.map((p) => [p, ""])));
    });

    $("#login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("#login-msg").textContent = "";
      try {
        await auth.signInWithEmailAndPassword(a, $("#email").value, $("#password").value);
      } catch (err) {
        $("#login-msg").textContent = "ログインできませんでした。メールアドレスとパスワードを確認してください。";
      }
    });
    $("#logout").addEventListener("click", () => auth.signOut(a));

    // ログイン状態はこのスマホに残るので、当日の朝に1回ログインすればよい
    auth.onAuthStateChanged(a, (user) => {
      $("#login").hidden = !!user;
      $("#panel").hidden = !user;
      unsubscribe?.();
      unsubscribe = null;
      if (!user) return;
      $("#who").textContent = user.email;
      unsubscribe = fs.onSnapshot(fs.collection(db, "crowd"), (snap) => {
        current = {};
        snap.forEach((d) => { const v = d.data(); current[d.id] = { level: v.level, updated_at: v.updated_at?.toMillis?.() }; });
        render();
      });
      render();
      // 今公開されている実況を入力欄に入れておく
      fs.getDoc(fs.doc(db, "chatter", "current")).then((snap) => {
        const d = snap.exists() ? snap.data() : {};
        PEOPLE.forEach((p) => ($(`#c-${p}`).value = d[p] ?? ""));
      }).catch(() => {});
    });
  </script>
</body>
</html>
